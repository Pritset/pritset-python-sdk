name: Production test lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pritset-python-sdk-production-test
  cancel-in-progress: false

jobs:
  lifecycle:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python scripts/production_lifecycle.py
        env:
          PRITSET_BASE_URL: https://api.pritset.com
          PRITSET_ACCESS_TOKEN: ${{ secrets.PRITSET_ACCESS_TOKEN }}
          PRITSET_SECRET: ${{ secrets.PRITSET_SECRET }}
          PRITSET_WEBHOOK_URL: ${{ secrets.PRITSET_WEBHOOK_URL }}
          PRITSET_ALLOW_PRODUCTION: "true"
          PRITSET_PRODUCTION_TEST_USER_CONFIRMED: ${{ vars.PRITSET_PRODUCTION_TEST_USER_CONFIRMED }}
          PRITSET_TEST_RUN_PREFIX: pritset-python-production-test
