[metadata]
name = pritset
version = 0.1.5
description = Official Python SDK for the Pritset document API
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Pritset
url = https://pritset.com
project_urls =
    Documentation = https://pritset.com/docs/api
    Source = https://github.com/Pritset/pritset-python-sdk
    Issues = https://github.com/Pritset/pritset-python-sdk/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Typing :: Typed

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    httpx>=0.24,<1
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
pritset = py.typed

[options.data_files]
share/pritset/contract =
    contract/contract.lock.json
    contract/openapi.yaml
share/pritset/contract/fixtures/templates =
    contract/fixtures/templates/list.json
    contract/fixtures/templates/get.json
share/pritset/contract/fixtures/documents =
    contract/fixtures/documents/webhook-job.json
share/pritset/contract/fixtures/errors =
    contract/fixtures/errors/field-errors.json
    contract/fixtures/errors/validation-problem.json
    contract/fixtures/errors/plain-text.txt
